name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data_pipeline/requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -q

      # 산출물이 저장소에 포함되어 있어 외부 데이터 없이 검증할 수 있다.
      # 어휘 위반이나 산출물 간 불일치가 생기면 여기서 드러난다.
      - name: Data quality report
        run: python data_pipeline/quality_report.py --strict

      - name: Verify derived outputs are in sync
        run: python data_pipeline/sync_service_categories.py
